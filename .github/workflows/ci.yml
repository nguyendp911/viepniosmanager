name: ViePN CI
on:
  push:
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Test
        run: cd backend && python -m pytest -q
  web-js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          assert '<script>' in html and '</script>' in html
          Path('/tmp/viepn-dashboard.js').write_text(
              html.split('<script>', 1)[1].split('</script>', 1)[0],
              encoding='utf-8'
          )
          PY
      - name: Check dashboard JavaScript syntax
        run: node --check /tmp/viepn-dashboard.js
  windows-remote-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unified BAT launcher without starting services
        shell: cmd
        run: |
          Start-ViePN.bat --self-test
          Update-ViePN.bat --self-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate updater offline without network access
        shell: pwsh
        run: |
          & ./windows/update-viepn.ps1 -SelfTest
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Updater self-test failed' }
      - name: Windows portable install smoke test
        shell: pwsh
        run: |
          python windows/build_portable.py
          $package = Join-Path $env:RUNNER_TEMP 'ViePN-Package'
          $destination = Join-Path $env:RUNNER_TEMP 'ViePN-Installed'
          Expand-Archive -LiteralPath 'dist/ViePN-Windows-Portable.zip' -DestinationPath $package -Force
          & (Join-Path $package 'windows/install-portable.ps1') -Source $package -Destination $destination
          if (-not (Test-Path (Join-Path $destination 'Start-ViePN.bat'))) {
            throw 'Portable install did not deliver Start-ViePN.bat'
          }
          if (-not (Test-Path (Join-Path $destination 'backend/viepn/api.py'))) {
            throw 'Portable install did not deliver backend'
          }
      - name: Parse PowerShell launcher scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem windows -Filter '*.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($file.Name)"
            }
          }
          Write-Host "All $($files.Count) PowerShell scripts parsed successfully."
  windows-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checksum-verified portable distribution
        run: python windows/build_portable.py
      - name: Audit ZIP file manifest and privacy
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          p=Path("dist/ViePN-Windows-Portable.zip")
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest in Path("dist/ViePN-Windows-Portable.sha256").read_text()
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("manifest.json"))
              assert m["version"]=="2.1.2"
              assert len(m["files"])>=15
              for name, sha in m["files"].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==sha
                  assert not any(w in name.lower() for w in (".env","access_token","session/","incoming/",".venv/",".git/"))
              assert "backend/viepn/applekit/certs/apple_gsa_ca.pem" in m["files"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ViePN-Windows-Portable-2.1
          path: |
            dist/ViePN-Windows-Portable.zip
            dist/ViePN-Windows-Portable.sha256
          if-no-files-found: error
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare ViePN iOS app icon
        run: sh ios/scripts/prepare-app-icon.sh
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS for device (unsigned)
        run: |
          xcodebuild -project ios/ViePNMobile.xcodeproj -scheme ViePNMobile -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ios/artifacts/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/ViePNMobile.app ios/artifacts/Payload/
          cd ios/artifacts && zip -qr ViePNMobile-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ViePNMobile-unsigned-ipa
          path: ios/artifacts/ViePNMobile-UNSIGNED.ipa
          if-no-files-found: error
