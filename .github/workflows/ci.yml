name: ViePN CI
on:
  push:
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Test
        run: cd backend && python -m pytest -q
  web-js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          assert '<script>' in html and '</script>' in html
          Path('/tmp/viepn-dashboard.js').write_text(
              html.split('<script>', 1)[1].split('</script>', 1)[0],
              encoding='utf-8'
          )
          PY
      - name: Check dashboard JavaScript syntax
        run: node --check /tmp/viepn-dashboard.js
  windows-remote-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell launcher scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem windows -Filter '*.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($file.Name)"
            }
          }
          Write-Host "All $($files.Count) PowerShell scripts parsed successfully."
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare ViePN iOS app icon
        run: sh ios/scripts/prepare-app-icon.sh
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS for device (unsigned)
        run: |
          xcodebuild -project ios/ViePNMobile.xcodeproj -scheme ViePNMobile -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ios/artifacts/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/ViePNMobile.app ios/artifacts/Payload/
          cd ios/artifacts && zip -qr ViePNMobile-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ViePNMobile-unsigned-ipa
          path: ios/artifacts/ViePNMobile-UNSIGNED.ipa
          if-no-files-found: error
